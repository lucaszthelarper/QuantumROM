name: QuantumROM Tools

on:
  workflow_dispatch:
    inputs:
      
      STOCK_DEVICE:
        description: "Select Stock Device"
        required: true
        type: choice
        options:
          - SM-A055F
          - SM-N985F
          - SM-A065F
          - SM-A225F
          - SM-A127F
          - None
        default: "SM-A127F"

      USE_UI_8_TETHERING_APEX:
        description: "Set True if your kernel BPF version is 5.4 (lower than 5.10)."
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "False"

      TARGET_DEVICE:
        description: "TARGET_DEVICE_MODEL."
        required: true
        default: "SM-A346E"

      TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK:
        description: "Input target device CSC code or direct download link."
        required: true
        default: "BKD"

      TARGET_FW_VERSION:
        description: "Specific Samsung firmware version (PDA/CSC/MODEM) OR (AP/CSC/CP)"
        required: false

      OUTPUT_FILESYSTEM:
        description: "Output filesystem. e.g erofs / ext4 / f2fs"
        required: true
        type: choice
        options:
          - "erofs"
          - "ext4"
          - "f2fs"
        default: "erofs"

      DEBLOAT_ROM:
        description: "Debloat downloaded rom (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      DEBLOAT_SAMSUNG_BIXBY:
        description: "Debloat Samsung Bixby apps (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      DEBLOAT_SAMSUNG_DEX:
        description: "Debloat Samsung DeX apps (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      SETUPWIZARD_MOD:
        description: "Patch Welcome at Setupwizard"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      SETTINGS_MOD:
        description: "Patch SecSettings to have exclusive features [Allow settings mod features Sixteen QRP2 only]"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_LIBS:
        description: "Patch libs for 64bit only ROM [Convert 64 to 32/64]"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      ADD_CHINA_SMART_MANAGER:
        description: "Add china smart manager (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      ADD_SAMSUNG_FLAGSHIP_APPS:
        description: "Add samsung flagship apps (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      ADD_CUSTOM_FEATURES:
        description: "Add samsung custom features (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_KNOX_GUARD:
        description: "Patch Samsung KnoxGuard / 3010 (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_FLAG_SECURE:
        description: "Bypass screenshot and screen record detection (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_SECURE_FOLDER:
        description: "Patch samsung secure folder (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_SIDE_FINGERPRINT:
        description: "Add side fingerprint sensor support (only runs on SDK 37.0 firmware, skipped otherwise)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      PATCH_BLUETOOTH_LIBRARY:
        description: "Patch bluetooth library (True/False)"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "True"

      A127F_KERNEL:
        description: "SM-A127F only: kernel vendor/odm to pack (ignored for other stock devices)"
        required: true
        type: choice
        options:
          - "5.10"
          - "4.19"
          - "none"
        default: "5.10"

      PACK_SUPER_IMG:
        description: "Pack system/product/system_ext/vendor/odm into super.img"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "False"

      SUPER_SIZE_BYTES:
        description: "Real super partition size in bytes (blank = SUPER_SIZE from device config, else sized to content)"
        required: false

      CREATE_FLASHABLE_ZIP:
        description: "Create flashable zip using the installer/ folder"
        required: true
        type: choice
        options:
          - "True"
          - "False"
        default: "False"

      COMPRESS_IMG:
        description: "Compress img to xz or br (brotli)"
        required: false
        type: choice
        options:
          - ""
          - "xz"
          - "br"
        default: ""

jobs:
  build:
    name: Start QuantumROM Tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository.
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set variables
        run: |
          echo "STOCK_DEVICE=${{ inputs.STOCK_DEVICE }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE=${{ inputs.TARGET_DEVICE }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK=${{ inputs.TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK }}" | tee -a "$GITHUB_ENV"
          echo "TARGET_FW_VERSION=${{ inputs.TARGET_FW_VERSION }}" | tee -a "$GITHUB_ENV"

          echo "FIRM_DIR=$(pwd)/FW/${{ inputs.TARGET_DEVICE }}" | tee -a "$GITHUB_ENV"
          echo "OUT_DIR=$(pwd)/OUT" | tee -a "$GITHUB_ENV"
          echo "WORK_DIR=$(pwd)/WORK" | tee -a "$GITHUB_ENV"
          echo "DEVICES_DIR=$(pwd)/QuantumROM/Devices" | tee -a "$GITHUB_ENV"
          echo "APKTOOL=$(pwd)/bin/java/apktool.jar" | tee -a "$GITHUB_ENV"
          echo "VNDKS_COLLECTION=$(pwd)/QuantumROM/vndks" | tee -a "$GITHUB_ENV"

          echo "DEBLOAT_ROM=${{ inputs.DEBLOAT_ROM }}" | tee -a "$GITHUB_ENV"
          echo "DEBLOAT_SAMSUNG_BIXBY=${{ inputs.DEBLOAT_SAMSUNG_BIXBY }}" | tee -a "$GITHUB_ENV"
          echo "DEBLOAT_SAMSUNG_DEX=${{ inputs.DEBLOAT_SAMSUNG_DEX }}" | tee -a "$GITHUB_ENV"
          echo "USE_UI_8_TETHERING_APEX=${{ inputs.USE_UI_8_TETHERING_APEX }}" | tee -a "$GITHUB_ENV"
          echo "SETTINGS_MOD=${{ inputs.SETTINGS_MOD }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_LIBS=${{ inputs.PATCH_LIBS }}" | tee -a "$GITHUB_ENV"
          echo "ADD_CHINA_SMART_MANAGER=${{ inputs.ADD_CHINA_SMART_MANAGER }}" | tee -a "$GITHUB_ENV"
          echo "ADD_SAMSUNG_FLAGSHIP_APPS=${{ inputs.ADD_SAMSUNG_FLAGSHIP_APPS }}" | tee -a "$GITHUB_ENV"
          echo "ADD_CUSTOM_FEATURES=${{ inputs.ADD_CUSTOM_FEATURES }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_FLAG_SECURE=${{ inputs.PATCH_FLAG_SECURE }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_SECURE_FOLDER=${{ inputs.PATCH_SECURE_FOLDER }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_KNOX_GUARD=${{ inputs.PATCH_KNOX_GUARD }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_BLUETOOTH_LIBRARY=${{ inputs.PATCH_BLUETOOTH_LIBRARY }}" | tee -a "$GITHUB_ENV"
          echo "PATCH_SIDE_FINGERPRINT=${{ inputs.PATCH_SIDE_FINGERPRINT }}" | tee -a "$GITHUB_ENV"

          echo "A127F_KERNEL=${{ inputs.A127F_KERNEL }}" | tee -a "$GITHUB_ENV"
          echo "PACK_SUPER_IMG=${{ inputs.PACK_SUPER_IMG }}" | tee -a "$GITHUB_ENV"
          echo "SUPER_SIZE_BYTES=${{ inputs.SUPER_SIZE_BYTES }}" | tee -a "$GITHUB_ENV"
          echo "CREATE_FLASHABLE_ZIP=${{ inputs.CREATE_FLASHABLE_ZIP }}" | tee -a "$GITHUB_ENV"

          # A 4.19 kernel is below 5.10 BPF, so it needs the OneUI 8 tethering apex (later entry wins in GITHUB_ENV).
          if [ "${{ inputs.STOCK_DEVICE }}" = "SM-A127F" ] && [ "${{ inputs.A127F_KERNEL }}" = "4.19" ]; then
              echo "USE_UI_8_TETHERING_APEX=True" | tee -a "$GITHUB_ENV"
          fi

          echo "OUTPUT_FILESYSTEM=${{ inputs.OUTPUT_FILESYSTEM }}" | tee -a "$GITHUB_ENV"
          echo "COMPRESS_IMG=${{ inputs.COMPRESS_IMG }}" | tee -a "$GITHUB_ENV"

      - name: Validate STOCK_DEVICE - ${{ inputs.STOCK_DEVICE }}
        run: |
          REPO="SN-Abdullah-Al-Noman/QuantumROM"
          BRANCH="Devices"

          source "$(pwd)/scripts/git_utils.sh"

          if [ "$STOCK_DEVICE" != "None" ]; then
              if ! curl -fsSL -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/contents/$STOCK_DEVICE?ref=$BRANCH" >/dev/null; then

                echo "❌ Unsupported: Device '$STOCK_DEVICE' not found in $REPO/$BRANCH"
                exit 1
              fi

              echo "✅ Device supported: $STOCK_DEVICE"
              GIT_SPARSE_DOWNLOAD "SN-Abdullah-Al-Noman/QuantumROM" "Devices" "$STOCK_DEVICE" \
                  "$(pwd)/QuantumROM/Devices/$STOCK_DEVICE"
          else
              echo "ℹ️ STOCK_DEVICE is set to None."
          fi

      - name: Check disk space
        id: disk
        run: |
          FREE_GB=$(df -BG "$GITHUB_WORKSPACE" | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free space: ${FREE_GB} GB"
          echo "enough=$([ "$FREE_GB" -ge 50 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Remove unnecessary files.
        if: steps.disk.outputs.enough == 'false'
        uses: rokibhasansagar/slimhub_actions@v25.42.5

      - name: Set up Java 25 (signapk.jar needs class version 68+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Dependencies.
        run: |
          sudo apt update
          sudo apt install -y p7zip-full lz4 liblz4-1 liblz4-dev libzstd1 libzstd-dev build-essential android-sdk-libsparse-utils \
              f2fs-tools fuse2fs fuse3 e2fsprogs python3 python3-pip zipalign unzip jq perl xxd kmod erofs-utils curl wget brotli pv bc
          # f2fs kernel module is only needed to mount f2fs images; the package does not exist for every runner kernel
          sudo apt install -y "linux-modules-extra-$(uname -r)" || echo "linux-modules-extra-$(uname -r) not available, continuing"
          sudo modprobe f2fs || true
          [ -d GoFileDownloader ] || git clone https://github.com/SN-Abdullah-Al-Noman/GoFileDownloader.git
          pip install --break-system-packages -r GoFileDownloader/requirements.txt
          mkdir -p "$FIRM_DIR" "$OUT_DIR" "$WORK_DIR"

      - name: Download firmware ▶️ ${{ inputs.TARGET_DEVICE }} - ${{ inputs.TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          DOWNLOAD_FIRMWARE "$TARGET_DEVICE" "$TARGET_DEVICE_CSC_OR_DOWNLOAD_LINK" "$FIRM_DIR" "$TARGET_FW_VERSION"

      - name: Extract firmware
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_FIRMWARE "$FIRM_DIR"

      - name: Extract super.img
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          EXTRACT_SUPER_IMG "$FIRM_DIR"

      - name: Extract firmware img
        run: |
          rm -rf "$FIRM_DIR"/*_b.img

          for img in "$FIRM_DIR"/*_a.img; do
              [ -f "$img" ] || continue
              mv -f "$img" "${img%_a.img}.img"
          done

          if [ -n "$STOCK_DEVICE" ] && [ "$STOCK_DEVICE" != "None" ]; then
              find "$FIRM_DIR" -mindepth 1 -maxdepth 1 \
              ! -name 'product.img' \
              ! -name 'system.img' \
              ! -name 'system_ext.img' \
              -exec rm -rf {} +
          fi

          # sudo required for f2fs img extract
          sudo bash -c 'source "'"$(pwd)"'/scripts/QuantumRom.sh"; EXTRACT_FIRMWARE_IMG "'"$FIRM_DIR"'" "all"'
          sudo chown -R "$(id -u):$(id -g)" "$FIRM_DIR" && chmod -R u+rwX "$FIRM_DIR"
          rm -rf "$FIRM_DIR"/*.img

      - name: Debloat Rom - ${{ inputs.DEBLOAT_ROM }}
        run: |
          source "$(pwd)/scripts/debloat.sh"

          if [ "$DEBLOAT_ROM" = "True" ]; then
              DEBLOAT "$FIRM_DIR"
          fi

          if [ "$DEBLOAT_SAMSUNG_BIXBY" = "True" ]; then
              DEBLOAT_SAMSUNG_BIXBY_APPS "$FIRM_DIR"
          fi

          if [ "$DEBLOAT_SAMSUNG_DEX" = "True" ]; then
              DEBLOAT_SAMSUNG_DEX_APPS "$FIRM_DIR"
          fi

      - name: Patch 32-Bit HALs - ${{ inputs.PATCH_LIBS }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_LIBS" = "True" ]; then
              PATCH_32BIT_HALS "$FIRM_DIR"
          fi

      - name: Apply stock device configuration
        run: |
          source "$(pwd)/scripts/debloat.sh"
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$STOCK_DEVICE" != "None" ]; then
              APPLY_STOCK_CONFIG "$STOCK_DEVICE" "$FIRM_DIR"
              DECOMPILE "$APKTOOL" "$FIRM_DIR/system/system/framework" "$FIRM_DIR/system/system/framework/ssrm.jar" "$WORK_DIR"
              PATCH_SSRM "$WORK_DIR/ssrm"
              RECOMPILE "$APKTOOL" "$FIRM_DIR/system/system/framework" "$WORK_DIR/ssrm" "$WORK_DIR"
              mv -f "$WORK_DIR/ssrm.jar" "$FIRM_DIR/system/system/framework/"
          fi

      - name: Add china smart manager - ${{ inputs.ADD_CHINA_SMART_MANAGER }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_CHINA_SMART_MANAGER" = "True" ]; then
              ADD_CHINA_SMART_MANAGER "$FIRM_DIR"
          fi

      - name: Add samsung flagship apps - ${{ inputs.ADD_SAMSUNG_FLAGSHIP_APPS }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_SAMSUNG_FLAGSHIP_APPS" = "True" ]; then
              ADD_SAMSUNG_OCR_APP "$FIRM_DIR"
              ADD_SAMSUNG_IMPORTANT_APPS "$FIRM_DIR"
              ADD_SAMSUNG_FULL_PHOTOEDITOR_APP "$FIRM_DIR"
          fi

      - name: Add custom features - ${{ inputs.ADD_CUSTOM_FEATURES }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$ADD_CUSTOM_FEATURES" = "True" ]; then
              APPLY_CUSTOM_FEATURES "$FIRM_DIR"
          fi

      - name: Patch SecSettings and SecSetupWizard - ${{ inputs.SETTINGS_MOD }} / ${{ inputs.ADD_CUSTOM_FEATURES }}
        run: |
         source "$(pwd)/scripts/QuantumRom.sh"

         if [ "$SETTINGS_MOD" = "True" ]; then
           declare -F PATCH_SEC_SETTINGS >/dev/null || { echo "::error::PATCH_SEC_SETTINGS missing in scripts/QuantumRom.sh"; exit 1; }
           PATCH_SEC_SETTINGS "$FIRM_DIR"
         fi

         if [ "$SETUPWIZARD_MOD" = "True" ]; then
           declare -F PATCH_SEC_SETUPWIZARD >/dev/null || { echo "::error::PATCH_SEC_SETUPWIZARD missing in scripts/QuantumRom.sh"; exit 1; }
           PATCH_SEC_SETUPWIZARD "$FIRM_DIR"
         fi

      - name: Patch flag secure and secure folder - ${{ inputs.PATCH_FLAG_SECURE }} - ${{ inputs.PATCH_SECURE_FOLDER }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_FLAG_SECURE" = "True" ] || [ "$PATCH_SECURE_FOLDER" = "True" ] || [ "$PATCH_KNOX_GUARD" = "True" ] || [ "$PATCH_SIDE_FINGERPRINT" = "True" ] || [ "$ADD_CHINA_SMART_MANAGER" = "True" ] || [ "$ADD_SAMSUNG_FLAGSHIP_APPS" = "True" ]; then
              INSTALL_FRAMEWORK "$APKTOOL" "$FIRM_DIR/system/system/framework/framework-res.apk"
              DECOMPILE "$APKTOOL" "$FIRM_DIR/system/system/framework" "$FIRM_DIR/system/system/framework/services.jar" "$WORK_DIR"
          fi

          if [ "$PATCH_FLAG_SECURE" = "True" ]; then
              PATCH_FLAG_SECURE "$FIRM_DIR" "$WORK_DIR/services"
          fi

          if [ "$PATCH_SECURE_FOLDER" = "True" ]; then
              PATCH_SECURE_FOLDER "$FIRM_DIR" "$WORK_DIR/services"
          fi

          if [ "$PATCH_KNOX_GUARD" = "True" ]; then
              PATCH_KNOX_GUARD "$WORK_DIR/services"
          fi

          if [ "$ADD_CHINA_SMART_MANAGER" = "True" ] || [ "$ADD_SAMSUNG_FLAGSHIP_APPS" = "True" ]; then
              PATCH_APK_SHARED_USER_ID_VERIFICATION "$FIRM_DIR" "$WORK_DIR/services"
          fi

          if [ "$PATCH_SIDE_FINGERPRINT" = "True" ]; then
              PATCH_SIDE_FINGERPRINT_SERVICES "$FIRM_DIR" "$WORK_DIR/services"
          fi

          # services.jar was decompiled above but never rebuilt, so none of the patches reached the ROM.
          if [ -d "$WORK_DIR/services" ]; then
              RECOMPILE "$APKTOOL" "$FIRM_DIR/system/system/framework" "$WORK_DIR/services" "$WORK_DIR"
          fi

          if [ -f "$WORK_DIR/services.jar" ]; then
              mv -f "$WORK_DIR/services.jar" "$FIRM_DIR/system/system/framework/"
              echo "✅ services.jar moved to rom."
          fi

      - name: Patch side fingerprint (framework / SystemUI / SecSettings) - ${{ inputs.PATCH_SIDE_FINGERPRINT }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_SIDE_FINGERPRINT" = "True" ]; then
              PATCH_SIDE_FINGERPRINT "$FIRM_DIR"
          fi

      - name: Patch bluetooth library- ${{ inputs.PATCH_BLUETOOTH_LIBRARY }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          if [ "$PATCH_BLUETOOTH_LIBRARY" = "True" ]; then
              PATCH_BT_LIB "$FIRM_DIR" "$WORK_DIR"
          fi

      - name: Apply others features and patch
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          PATCH_SELINUX "$FIRM_DIR"
          DISABLE_SECURITY "$FIRM_DIR"

      - name: Build img - ${{ inputs.OUTPUT_FILESYSTEM }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          B_ID="$(grep -m1 '^ro.system.build.id=' "$FIRM_DIR/system/system/build.prop" | cut -d= -f2 | tr -d '\r')"
          B_V="$(grep -m1 '^ro.system.build.version.incremental=' "$FIRM_DIR/system/system/build.prop" | cut -d= -f2 | tr -d '\r')"
          BUILD_PROP "$FIRM_DIR" "system" "ro.build.display.id" "ProjectDozG Tool+ Paradigm                                                  ${B_ID} ${B_V}"
          BUILD_PROP "$FIRM_DIR" "product" "ro.build.display.id" "ProjectDozG Tool+ Paradigm                                                  ${B_ID} ${B_V}"
          BUILD_IMG "$FIRM_DIR" "all" "$OUTPUT_FILESYSTEM" "$OUT_DIR"

      - name: Add SM-A127F kernel vendor/odm - ${{ inputs.A127F_KERNEL }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          FETCH_A127F_VENDOR_ODM "$STOCK_DEVICE" "$A127F_KERNEL" "$OUT_DIR"

      - name: Pack super.img - ${{ inputs.PACK_SUPER_IMG }}
        if: inputs.PACK_SUPER_IMG == 'True'
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"

          SIZE="$SUPER_SIZE_BYTES"
          SLOTS=""
          if [ "$STOCK_DEVICE" != "None" ]; then
              [ -z "$SIZE" ] && SIZE="$(GET_DEVICE_CONFIG "$STOCK_DEVICE" SUPER_SIZE)"
              SLOTS="$(GET_DEVICE_CONFIG "$STOCK_DEVICE" SUPER_METADATA_SLOTS)"
          fi

          PACK_SUPER_IMG "$OUT_DIR" "$SIZE" "${SLOTS:-2}"

      - name: Compress all .img & make zip file before upload - - ${{ inputs.COMPRESS_IMG }}
        run: |
          echo "BUILD_TIME=$(TZ='Asia/Dhaka' date '+%Y-%m-%d %I:%M:%S %p UTC+6')" | tee -a "$GITHUB_ENV"
          ZIP_NAME="${{ inputs.TARGET_DEVICE }}_Port_For_${{ inputs.STOCK_DEVICE }}.zip"
          if [ "$STOCK_DEVICE" = "SM-A127F" ] && [ "$A127F_KERNEL" != "none" ]; then
              ZIP_NAME="${{ inputs.TARGET_DEVICE }}_Port_For_${{ inputs.STOCK_DEVICE }}_K${A127F_KERNEL}.zip"
          fi
          ZIP_PATH="$OUT_DIR/$ZIP_NAME"

          FILE_LIST=$(find "$OUT_DIR" -type f -printf '%P\n' | sort)
          FILE_COUNT=$(printf '%s\n' "$FILE_LIST" | grep -c . || true)

          {
              echo "ZIP_FILE_COUNT=$FILE_COUNT"
              echo "ZIP_FILE_LIST<<EOF"
              echo "$FILE_LIST"
              echo "EOF"
          } >> "$GITHUB_ENV"

          if [ "$COMPRESS_IMG" = "xz" ]; then
              echo "Compressing all .img files to .xz (level 9)..."
              for img in "$OUT_DIR"/*.img; do
                  [ -f "$img" ] || continue
                  echo "Compressing $img"
                  xz -5 -T0 "$img"
              done

          elif [ "$COMPRESS_IMG" = "br" ]; then
              echo "Compressing all .img files to .br (Brotli level 11)..."

              for img in "$OUT_DIR"/*.img; do
                  [ -f "$img" ] || continue

                  echo "Compressing $img"
                  pv -pterab "$img" | brotli -q 5 > "${img}.br"
                  rm -f "$img"
              done
              fi

          if [ "$CREATE_FLASHABLE_ZIP" = "True" ]; then
              source "$(pwd)/scripts/QuantumRom.sh"
              MAKE_FLASHABLE_ZIP "$OUT_DIR" "$(pwd)/installer" "$ZIP_PATH"
          else
              echo "Creating zip: $ZIP_NAME"
              7z a -tzip "$ZIP_PATH" "$OUT_DIR"/* -mx=5
          fi
          echo "ZIP_PATH=$ZIP_PATH" | tee -a "$GITHUB_ENV"

      - name: Upload file in GoFile & Create Release.
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          source "$(pwd)/scripts/QuantumRom.sh"
          export ANDROID_VERSION=$(GET_PROP "$FIRM_DIR" "system" "ro.system.build.version.release")
          ONEUI_VERSION=$(GET_PROP "$FIRM_DIR" "system" "ro.build.version.oneui")
          export ONEUI_VERSION="$((ONEUI_VERSION / 10000)).$(((ONEUI_VERSION / 100) % 100))"
          export BUILD_VERSION=$(GET_PROP "$FIRM_DIR" "system" "ro.build.version.incremental")
          export SDK_VERSION=$(GET_PROP "$FIRM_DIR" "system" "ro.system.build.version.sdk")
          export SECURITY_PATCH=$(GET_PROP "$FIRM_DIR" "system" "ro.build.version.security_patch")
          export CPU_ABILIST=$(GET_PROP "$FIRM_DIR" "system" "ro.system.product.cpu.abilist")
          bash release.sh
